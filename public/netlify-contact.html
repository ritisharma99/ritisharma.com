<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Contact (Netlify form detection)</title>
  </head>
  <body>
    <!-- This static page exists so Netlify can detect the `contact` form at deploy time -->
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/">
      <input type="hidden" name="form-name" value="contact" />
      <p style="display:none"><label>Don't fill this out if you're human: <input name="bot-field" /></label></p>
      <p><label>Name: <input name="name" type="text" /></label></p>
      <p><label>Email: <input name="email" type="email" /></label></p>
      <p><label>Message: <textarea name="message" rows="6"></textarea></label></p>
      <p><button type="submit">Send Message</button></p>
    </form>
  </body>
</html>
